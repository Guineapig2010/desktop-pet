<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: buddy:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Chat</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="panel" id="panel">
    <header class="titlebar">
      <img class="avatar" src="../../../assets/avatar.png" alt="" onerror="this.style.visibility='hidden'" />
      <div class="titles">
        <div class="name" id="name">General Fok</div>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">…</span></div>
      </div>
      <div class="actions">
        <button class="icon" id="settingsBtn" title="Settings">⚙︎</button>
        <button class="icon" id="collapseBtn" title="Minimize">–</button>
        <button class="icon close" id="closeBtn" title="Close (he keeps running; reopen from the menu bar or double-click him)">×</button>
      </div>
    </header>
    <div class="offline-banner hidden" id="offlineBanner">
      <b>Offline mode</b> — replies are scripted, not AI. <a href="#" id="setupLink">Connect an AI service</a> to really chat.
    </div>
    <main class="messages" id="messages"></main>
    <footer class="composer">
      <textarea id="input" rows="1" placeholder="Ask him anything…" maxlength="4000"></textarea>
      <button id="send" class="send" title="Send (Enter)">Send</button>
    </footer>
  </div>
  <script type="module" src="chat.js"></script>
</body>
</html>
